<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Clases</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#6c3df5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Clases">
<style>
:root{--bg:#f6f3ff;--card:#fff;--ink:#1e1b3a;--mut:#7a7699;--pri:#6c3df5;--line:#e6e1fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#6c3df5,#ff4d8d);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 18px;border-radius:0 0 26px 26px}
h1{margin:0;font-size:24px;font-weight:800}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.nav b{font-size:17px}
.nav button{background:#ffffff33;color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:20px}
main{padding:14px}
.day{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;box-shadow:0 2px 10px #6c3df514}
.day.today{outline:2.5px solid var(--pri)}
.dn{width:44px;text-align:center;flex:none}.dn small{display:block;color:var(--mut);font-weight:700}.dn span{font-size:24px;font-weight:800}
.cls{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.c{border:0;text-align:left;color:#fff;border-radius:12px;padding:8px 11px;font:inherit;display:flex;justify-content:space-between;gap:8px}
.c i{font-style:normal;opacity:.9;font-size:13px}.c b{display:block}
.add{border:2px dashed var(--line);background:none;color:var(--mut);border-radius:12px;padding:7px;font:inherit;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs button{flex:1;border:0;background:none;padding:8px;font:inherit;font-weight:700;color:var(--mut);border-radius:14px}
.tabs button.on{background:var(--bg);color:var(--pri)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #6c3df514}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input,select{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0;width:100%}
input[type=color]{width:46px;height:44px;padding:3px;flex:none}
label{display:block;font-weight:700;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{border:0;background:var(--pri);color:#fff;font:inherit;font-weight:800;padding:12px 16px;border-radius:14px;width:100%}
.btn.g{background:var(--line);color:var(--ink)}.btn.r{background:#ffe3ea;color:#d1004d}
.seg{display:flex;background:#ffffff33;border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:7px;border-radius:10px}
.seg button.on{background:#fff;color:var(--pri)}
.tot{font-size:34px;font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.bar div{height:100%}
.sp{display:flex;justify-content:space-between;align-items:baseline}
.mut{color:var(--mut);font-size:14px}
dialog{border:0;border-radius:22px;padding:18px;width:min(92vw,420px);color:var(--ink)}
dialog::backdrop{background:#1e1b3a88}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:2.5px solid transparent;color:#fff;font:inherit;font-weight:700;padding:8px 13px;border-radius:20px}
.chip.on{border-color:var(--ink)}
.chip:not(.on){opacity:.55}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body>
<header><h1>Mis Clases</h1><div class="nav"><button id="prev">‹</button><b id="ttl"></b><button id="next">›</button></div>
<div class="seg" id="seg" hidden></div></header>
<main id="m"></main>
<nav class="tabs"><button data-t="cal">Calendario</button><button data-t="sum">Pagos</button><button data-t="gym">Gimnasios</button></nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const PAL=['#ff4d8d','#6c3df5','#06b6a4','#ff8a1f','#2f8cff','#e0a800','#8ac926'];
const DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let S;try{S=JSON.parse(localStorage.getItem('misclases'))}catch(e){}
S=S||{gyms:[],cls:[]};
const save=()=>{try{localStorage.setItem('misclases',JSON.stringify(S))}catch(e){}};
let tab='cal',per='week',ref=new Date();ref.setHours(12,0,0,0);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c,12)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('es-MX');
const gym=id=>S.gyms.find(g=>g.id===id);
const uid=()=>Math.random().toString(36).slice(2,9);
function range(){
 if(tab==='cal'||per==='week'){const w=(ref.getDay()+6)%7,a=addD(ref,-w);return[a,addD(a,6)]}
 const y=ref.getFullYear(),m=ref.getMonth();
 if(per==='month')return[new Date(y,m,1,12),new Date(y,m+1,0,12)];
 return ref.getDate()<=15?[new Date(y,m,1,12),new Date(y,m,15,12)]:[new Date(y,m,16,12),new Date(y,m+1,0,12)];
}
function title(){const[a,b]=range();
 if(per==='month'&&tab==='sum')return MN[a.getMonth()]+' '+a.getFullYear();
 return a.getDate()+' '+MN[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+MN[b.getMonth()].slice(0,3)}
function step(n){
 if(tab==='cal'||per==='week')ref=addD(ref,7*n);
 else if(per==='month')ref=new Date(ref.getFullYear(),ref.getMonth()+n,1,12);
 else{const q=ref.getDate()<=15;ref=n>0?(q?new Date(ref.getFullYear(),ref.getMonth(),16,12):new Date(ref.getFullYear(),ref.getMonth()+1,1,12)):(q?new Date(ref.getFullYear(),ref.getMonth()-1,16,12):new Date(ref.getFullYear(),ref.getMonth(),1,12))}
 render()}
function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const nav=tab!=='gym';document.querySelector('.nav').hidden=!nav;
 const seg=$('#seg');seg.hidden=tab!=='sum';
 seg.innerHTML=[['week','Semana'],['fortnight','Quincena'],['month','Mes']].map(([k,v])=>`<button data-p="${k}" class="${per===k?'on':''}">${v}</button>`).join('');
 if(nav)$('#ttl').textContent=title();
 $('#m').innerHTML=tab==='cal'?cal():tab==='sum'?sum():gyms();
}
function cal(){
 if(!S.gyms.length)return`<div class="empty">Primero agrega tus gimnasios en la pestaña <b>Gimnasios</b>.</div>`;
 const[a]=range(),t=ymd(new Date());let h='';
 for(let i=0;i<7;i++){const d=addD(a,i),k=ymd(d);
  const L=S.cls.filter(c=>c.date===k).sort((x,y)=>x.start.localeCompare(y.start));
  h+=`<div class="day ${k===t?'today':''}"><div class="dn"><small>${DN[i]}</small><span>${d.getDate()}</span></div><div class="cls">`+
  L.map(c=>{const g=gym(c.gym)||{name:'?',color:'#999'};return`<button class="c" style="background:${g.color}" data-e="${c.id}"><span><b>${g.name}</b><i>${c.start} – ${c.end}</i></span><b>${money(c.price)}</b></button>`}).join('')+
  `<button class="add" data-a="${k}">+ Agregar clase</button></div></div>`}
 return h}
function sum(){
 const[a,b]=range(),A=ymd(a),B=ymd(b);
 const L=S.cls.filter(c=>c.date>=A&&c.date<=B);
 const tot=L.reduce((s,c)=>s+c.price,0);
 let h=`<div class="card"><div class="mut">Total a cobrar</div><div class="tot">${money(tot)}</div><div class="mut">${L.length} clase${L.length==1?'':'s'}</div></div>`;
 S.gyms.forEach(g=>{const x=L.filter(c=>c.gym===g.id),s=x.reduce((q,c)=>q+c.price,0);
  h+=`<div class="card"><div class="sp"><b style="color:${g.color}">${g.name}</b><b style="font-size:22px">${money(s)}</b></div><div class="mut">${x.length} clase${x.length==1?'':'s'}</div><div class="bar"><div style="width:${tot?s/tot*100:0}%;background:${g.color}"></div></div></div>`});
 if(!S.gyms.length)h+=`<div class="empty">Aún no hay gimnasios.</div>`;
 return h}
function gyms(){
 let h=S.gyms.map(g=>`<div class="card"><div class="row"><input type="color" value="${g.color}" data-gc="${g.id}"><input value="${g.name}" data-gn="${g.id}" placeholder="Nombre"></div>
 <label>Pago por clase</label><input type="number" inputmode="decimal" value="${g.rate}" data-gr="${g.id}"><div style="height:10px"></div><button class="btn r" data-gd="${g.id}">Eliminar</button></div>`).join('');
 h+=`<button class="btn" id="ng">+ Nuevo gimnasio</button><div style="height:10px"></div>
 <button class="btn g" id="ex">Guardar respaldo</button><div style="height:10px"></div><button class="btn g" id="im">Restaurar respaldo</button>
 <p class="mut">Cambiar la tarifa de un gimnasio solo afecta clases nuevas; las ya registradas conservan su precio.</p>`;
 return h}
function openClass(date,id){
 const c=id?S.cls.find(x=>x.id===id):{date,gym:S.gyms[0].id,start:'18:00',end:'19:00',price:S.gyms[0].rate};
 const d=$('#dlg');
 d.innerHTML=`<label style="margin-top:0">Gimnasio</label><div class="chips">${S.gyms.map(g=>`<button type="button" class="chip ${g.id===c.gym?'on':''}" style="background:${g.color}" data-g="${g.id}">${g.name}</button>`).join('')}</div>
 <label>Fecha</label><input type="date" id="fd" value="${c.date}">
 <div class="row" style="margin-top:0"><div style="flex:1"><label>Inicio</label><input type="time" id="fs" value="${c.start}"></div><div style="flex:1"><label>Fin</label><input type="time" id="fe" value="${c.end}"></div></div>
 <label>Cobro de esta clase</label><input type="number" inputmode="decimal" id="fp" value="${c.price}"><div style="height:14px"></div>
 <button class="btn" id="fsv">Guardar</button>${id?'<div style="height:8px"></div><button class="btn r" id="fdl">Eliminar clase</button>':''}<div style="height:8px"></div><button class="btn g" id="fcx">Cancelar</button>`;
 d.showModal();let g=c.gym;
 d.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;d.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));if(!id)$('#fp').value=gym(g).rate});
 $('#fcx').onclick=()=>d.close();
 $('#fsv').onclick=()=>{const o={id:id||uid(),gym:g,date:$('#fd').value||c.date,start:$('#fs').value,end:$('#fe').value,price:+$('#fp').value||0};
  if(id)Object.assign(c,o);else S.cls.push(o);save();d.close();render()};
 if(id)$('#fdl').onclick=()=>{S.cls=S.cls.filter(x=>x.id!==id);save();d.close();render()}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render()}
 else if(t.dataset.p){per=t.dataset.p;render()}
 else if(t.dataset.a)openClass(t.dataset.a);
 else if(t.dataset.e)openClass(null,t.dataset.e);
 else if(t.dataset.gd){if(confirm('¿Eliminar gimnasio y sus clases?')){S.gyms=S.gyms.filter(g=>g.id!==t.dataset.gd);S.cls=S.cls.filter(c=>c.gym!==t.dataset.gd);save();render()}}
 else if(t.id==='ng'){S.gyms.push({id:uid(),name:'Nuevo gimnasio',color:PAL[S.gyms.length%PAL.length],rate:0});save();render()}
 else if(t.id==='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mis-clases-respaldo.json';a.click()}
 else if(t.id==='im'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(j.gyms&&j.cls){S=j;save();render()}}catch(e){alert('Archivo no válido')}};i.click()}});
document.addEventListener('input',e=>{const t=e.target,id=t.dataset;let g;
 if(id.gc||id.gn||id.gr){g=gym(id.gc||id.gn||id.gr);if(id.gc)g.color=t.value;if(id.gn)g.name=t.value;if(id.gr)g.rate=+t.value||0;save()}});
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
